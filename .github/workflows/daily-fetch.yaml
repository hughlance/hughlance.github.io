name: Run Daily Fetch Scripts

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # If your scripts don't use node_modules/package.json, you can delete this step:
      - name: Install dependencies
        run: npm install

      - name: Fetch Pokédex Data
        run: node scripts/fetch-pokedex.mjs

      - name: Fetch Usage Data
        run: node scripts/fetch-usage.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-update pokedex and usage data [skip ci]"
            git push
          else
            echo "No changes detected, skipping commit."
          fi