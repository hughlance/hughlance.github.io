name: Update Champions Battle Data (pokedex + sprites)

on:
  schedule:
    # Champions battle data is refreshed daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-pokedex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Champions battle data + sprites
        run: node scripts/fetch-pokedex.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pokedex.json assets/sprites
          git diff --cached --quiet || git commit -m "Update Champions battle data"
          git push
