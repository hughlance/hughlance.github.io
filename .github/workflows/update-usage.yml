name: Update Champions VGC usage data

on:
  schedule:
    # Runs after the daily Champions refresh and once Smogon's prior-month stats are available.
    - cron: "0 8 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and parse Champions VGC usage stats
        run: node scripts/fetch-usage.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update Champions VGC usage data"
          git push
